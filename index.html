<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobTrail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>JobTrail</h1>
    <nav id="nav" aria-label="Views">
      <button data-view="board" class="on">Board</button>
      <button data-view="list">List</button>
      <button data-view="cal">Calendar</button>
      <button data-view="insights">Insights</button>
    </nav>
    <div class="tools">
      <button id="sample">Load sample data</button>
      <button id="csv">Export CSV</button>
      <button id="export">Export backup</button>
      <button id="import">Import backup</button>
      <button id="theme">Switch theme</button>
      <button id="clear" class="danger">Clear all</button>
    </div>
  </aside>
  <main>
    <header class="head">
      <div><h2 id="pageTitle">Board</h2><p id="pageSub"></p></div>
      <button id="add" class="primary">+ New application</button>
    </header>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search (press /)" aria-label="Search">
      <select id="fPri" aria-label="Filter by priority"><option value="">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
      <label class="chk"><input type="checkbox" id="fOd"> Overdue only</label>
    </div>
    <div class="stats" id="stats"></div>
    <section id="view" aria-live="polite"></section>
  </main>
</div>

<dialog id="dlg">
  <form id="f">
    <h2 id="dTitle">New application</h2>
    <div class="grid">
      <label>Company <input name="company" required maxlength="60"></label>
      <label>Role <input name="role" required maxlength="80"></label>
      <label>Location <input name="location" maxlength="60" placeholder="City or Remote"></label>
      <label>Salary <input name="salary" maxlength="30" placeholder="e.g. 6,000 per month"></label>
      <label>Stage <select name="stage"></select></label>
      <label>Job link <input name="link" type="url" placeholder="https://"></label>
      <label>Date applied <input name="applied" type="date"></label>
      <label>Interview date <input name="interview" type="date"></label>
      <label>Follow-up date <input name="followup" type="date"></label>
      <label>Priority <select name="priority"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>
      <label>Work type <select name="type"><option value="">Not set</option><option>Remote</option><option>Hybrid</option><option>On-site</option></select></label>
      <label>Contact <input name="contact" maxlength="80" placeholder="Recruiter name or email"></label>
    </div>
    <label>Notes <textarea name="notes" rows="3" maxlength="500" placeholder="Contacts, questions to ask, next steps"></textarea></label>
    <div id="hist" class="hist"></div>
    <div class="actions">
      <button type="button" id="del" class="danger">Delete</button>
      <span class="sp"></span>
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<input type="file" id="file" accept="application/json" hidden>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
